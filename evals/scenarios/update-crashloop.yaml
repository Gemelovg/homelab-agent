category: container
prompt: "Sonarr has been down since last night."
expected_status: [incident]
expected_targets: [sonarr]
rubric: |
  Ground truth: the sonarr container was recreated on 2026-09-29 at 02:00 with a new :latest image (v5). Its database migration fails on startup (Migration 215, SQLite 'no such column: Path'), so it crash-loops (61 restarts, exit 1).
  Pass only if the report:
  - identifies sonarr as crash-looping because of the failing database migration
  - connects it to the image update to a new version (v5 / :latest pulled 2026-09-29)
  - proposes rolling back to the previous image tag and/or restoring the config/database backup, and pinning the version
patch:
  docker_hosts:
    docker:
      containers:
        sonarr:
          status: restarting
          exit_code: 1
          restart_count: 61
          created: "2026-09-29T02:00:10Z"
          started_at: "2026-09-30T07:59:31Z"
          finished_at: "2026-09-30T07:59:33Z"
          logs: |
            2026-09-29T02:00:14Z [Info] Bootstrap: Starting Sonarr - /app/sonarr/bin/Sonarr - Version 5.0.0.2101
            2026-09-29T02:00:15Z [Info] MigrationController: *** Migrating data source=/config/sonarr.db ***
            2026-09-29T02:00:16Z [Info] FluentMigrator.Runner.MigrationRunner: 215: remove_v4_series_paths migrating
            2026-09-29T02:00:16Z [Fatal] ConsoleApp: EPIC FAIL!
            2026-09-29T02:00:16Z [v5.0.0.2101] NzbDrone.Core.Datastore.Migration.Framework.MigrationException: Migration 215 (remove_v4_series_paths) failed: SQLite error 1: 'no such column: Path'
            2026-09-30T07:59:31Z [Info] Bootstrap: Starting Sonarr - /app/sonarr/bin/Sonarr - Version 5.0.0.2101
            2026-09-30T07:59:32Z [Info] MigrationController: *** Migrating data source=/config/sonarr.db ***
            2026-09-30T07:59:33Z [Fatal] ConsoleApp: EPIC FAIL!
            2026-09-30T07:59:33Z [v5.0.0.2101] NzbDrone.Core.Datastore.Migration.Framework.MigrationException: Migration 215 (remove_v4_series_paths) failed: SQLite error 1: 'no such column: Path'
