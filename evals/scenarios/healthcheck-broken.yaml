category: container
prompt: health_check
expected_status: [degraded]
expected_targets: [excalidraw]
# Proposed actions: at least one 'expected' (if any listed), and nothing outside expected + acceptable.
actions:
  expected:
  - {type: compose_change, container: excalidraw, compose_field: healthcheck_test}
  acceptable:
  - {type: compose_change, container: excalidraw, compose_field: image}
rubric: |
  Ground truth: excalidraw is marked unhealthy, but the app works: it keeps serving HTTP 200s to users. The health check fails because the updated image (2026-09-29) no longer contains curl ("/bin/sh: curl: not found").
  Pass only if the report:
  - identifies the health check itself as broken (curl missing from the image), not the app being down
  - proposes fixing the health check (e.g. use wget or another command) or pinning the previous image
patch:
  docker_hosts:
    docker:
      containers:
        excalidraw:
          health: unhealthy
          failing_streak: 960
          created: "2026-09-29T02:00:30Z"
          health_log:
            - {exit_code: 127, output: "/bin/sh: curl: not found"}
            - {exit_code: 127, output: "/bin/sh: curl: not found"}
            - {exit_code: 127, output: "/bin/sh: curl: not found"}
          logs: |
            2026-09-29T21:02:11Z 10.20.0.15 - - "GET / HTTP/1.1" 200 1840
            2026-09-30T07:44:51Z 10.20.0.15 - - "GET /assets/index.js HTTP/1.1" 200 412883
            2026-09-30T07:45:02Z 10.20.0.15 - - "GET /assets/vendor.js HTTP/1.1" 200 801230
