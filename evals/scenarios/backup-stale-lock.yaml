category: backup
prompt: "Backups keep failing for one container."
expected_status: [degraded, incident]
expected_targets: [gitea, "108", lock, backup, vzdump]
rubric: |
  Ground truth: CT 108 (gitea) still has a 'backup' lock left over from a backup run that died on 2026-09-26. Every nightly backup since then fails for it with "CT is locked (backup)".
  Pass only if the report:
  - identifies CT 108 / gitea as the failing guest
  - identifies the stale backup lock left by the interrupted run as the cause
  - proposes removing the lock (e.g. pct unlock 108) after making sure no backup is running
patch:
  proxmox:
    guests:
      108:
        config: {lock: backup}
    tasks:
      vzdump-crashed:
        upid: "UPID:pve:00021A0F:00B1C2D3:66F4C380:vzdump::root@pam:"
        type: vzdump
        id: ""
        user: root@pam
        status: "unexpected status"
        starttime: 1790384400
        endtime: 1790384520
        log: |
          INFO: starting new backup job: vzdump 101 102 107 108 --mode snapshot --storage pbs --compress zstd
          INFO: Starting Backup of VM 101 (lxc)
          INFO: Finished Backup of VM 101 (00:00:20)
          INFO: Starting Backup of VM 102 (lxc)
          INFO: Finished Backup of VM 102 (00:03:58)
          INFO: Starting Backup of VM 107 (qemu)
          INFO: Finished Backup of VM 107 (00:03:09)
          INFO: Starting Backup of VM 108 (lxc)
          INFO: creating Proxmox Backup Server archive 'ct/108/2026-09-26T01:00:00Z'
      vzdump-nightly:
        status: "job errors"
        log: |
          INFO: starting new backup job: vzdump 101 102 107 108 --mode snapshot --storage pbs --compress zstd
          INFO: Starting Backup of VM 101 (lxc)
          INFO: Finished Backup of VM 101 (00:00:21)
          INFO: Starting Backup of VM 102 (lxc)
          INFO: Finished Backup of VM 102 (00:04:02)
          INFO: Starting Backup of VM 107 (qemu)
          INFO: Finished Backup of VM 107 (00:03:11)
          INFO: Starting Backup of VM 108 (lxc)
          ERROR: Backup of VM 108 failed - CT is locked (backup)
          TASK ERROR: job errors
