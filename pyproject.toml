[project]
name = "homelab-agent"
version = "0.1.0"
description = "MCP server + AI ops agent for a Proxmox/Docker homelab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker[ssh]>=7.2.0",
    "mcp>=2.2.0",
    "proxmoxer>=2.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
homelab-mcp = "homelab_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
